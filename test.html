<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;">

<h2>Career AI Test</h2>

<textarea id="job" style="width:100%;height:100px;padding:8px;">
Hiring a React developer. Must know JavaScript, TypeScript, Node.js and REST APIs.
</textarea>

<br><br>

<button onclick="runTest()" style="padding:15px;font-size:16px;">
Test Supabase
</button>

<h3>Result:</h3>
<pre id="out" style="background:#000;padding:15px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;">(waiting)</pre>

<script>
async function runTest() {
  var out = document.getElementById("out");
  out.textContent = "Sending...";

  try {
    var res = await fetch(
      "https://shunmyrxozakhexnzuhj.supabase.co/functions/v1/dynamic-function",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": "PASTE_YOUR_ANON_KEY_HERE"
        },
        body: JSON.stringify({
          jobDescription: document.getElementById("job").value,
          profile: { name: "Estifanos", title: "Full-Stack Developer", skills: "JavaScript, React, Node.js" }
        })
      }
    );
    var text = await res.text();
    out.textContent = "STATUS: " + res.status + "\n\n" + text;
  } catch (err) {
    out.textContent = "ERROR: " + err.message;
  }
}
</script>

</body>
</html>
