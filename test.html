<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test</title>
</head>
<body style="font-family:sans-serif;padding:20px;background:#111;color:#fff;">

<h2>Career AI Test</h2>

<textarea id="job" style="width:100%;height:120px;padding:8px;">
Hiring a React developer. Must know JavaScript, TypeScript, Node.js and REST APIs.
</textarea>

<br><br>

<button id="go" style="padding:12px 20px;font-size:16px;">
Test Supabase
</button>

<h3>Result:</h3>
<pre id="out" style="background:#000;padding:15px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;">(waiting...)</pre>

<script>
document.getElementById("go").onclick = async function () {
  var out = document.getElementById("out");
  out.textContent = "Sending request...";

  try {
    var res = await fetch(
      "https://shunmyrxozakhexnzuhj.supabase.co/functions/v1/dynamic-function",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": "https"
        },
        body: JSON.stringify({
          jobDescription: document.getElementById("job").value,
          profile: {
            name: "Estifanos",
            title: "Full-Stack Developer",
            skills: "JavaScript, TypeScript, React, Node.js, REST APIs, Supabase, AI"
          }
        })
      }
    );

    var text = await res.text();
    out.textContent = "STATUS: " + res.status + "\n\n" + text;
  } catch (err) {
    out.textContent = "ERROR: " + err.message;
  }
};
</script>

</body>
  </html>
